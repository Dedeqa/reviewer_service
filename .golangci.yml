run:
  timeout: 3m

linters:
  # Включаем только основные линтеры
  enable:

    - gofmt       # Проверка форматирования
    - govet       # Статический анализ
    - errcheck    # Проверка обработки ошибок
    - staticcheck # Продвинутый статический анализ
    - gosimple    # Поиск упрощений кода
    - unused      # Поиск неиспользуемого кода
    - ineffassign # Обнаружение бесполезных присваиваний

issues:
  # Максимальное количество проблем
  max-issues-per-linter: 50
  max-same-issues: 10

linters-settings:
  gofmt:
    simplify: true

  govet:
    check-shadowing: true

  errcheck:
    check-type-assertions: false
    check-blank: false

  staticcheck:
    checks: [ "all" ]